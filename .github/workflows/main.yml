name: Generate IRIAM Calendar
on:
  schedule:
    - cron: '*/10 * * * *' # 10分ごとに実行（エラー回避と即時性のベストバランス）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install feedparser ics python-dateutil pytz

      - name: Run script
        run: python main.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json calendar.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update calendar" && git push)
